<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procut Quotation Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--y:#F6B90A;--y-dark:#c99500;--ink:#141414;--gray:#666;--bg:#f7f7f5;--card:#fff;--line:#e5e5e0;--ok:#1a9c4a;--bad:#d63333;--warn:#c98a00;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:60px;}
header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
header img{height:36px;}
header h1{font-size:18px;font-weight:700;}
header span{color:var(--y);}
.wrap{max-width:1100px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h2 .n{background:var(--y);color:var(--ink);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
button{cursor:pointer;border:none;border-radius:7px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;}
.btn-y{background:var(--y);color:var(--ink);}
.btn-y:hover{background:var(--y-dark);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-out{background:#fff;border:1px solid var(--line)!important;color:var(--ink);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{background:#fce8e8;color:var(--bad);}
.price-opts{display:flex;gap:8px;flex-wrap:wrap;}
.price-opts label{border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;}
.price-opts input{accent-color:var(--y);margin-right:6px;}
.price-opts label.sel{background:var(--y);border-color:var(--y);font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--ink);color:#fff;text-align:left;padding:10px 8px;font-size:12px;position:sticky;top:56px;}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:#fcfbf6;}
td img{width:64px;height:64px;object-fit:contain;border-radius:6px;border:1px solid var(--line);background:#fff;padding:2px;}
input.cell{width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:13px;}
input.qty{width:55px;}
input.price{width:75px;}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block;}
.b-ok{background:#e5f7ea;color:var(--ok);}
.b-bad{background:#fce8e8;color:var(--bad);}
.b-warn{background:#fff3dc;color:var(--warn);}
.variant-group{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:8px;background:#fbfbf9;}
.variant-group .vhead{font-weight:700;font-size:13px;margin-bottom:6px;}
.vrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.vrow:last-child{border-bottom:none;}
.hint{color:var(--gray);font-size:12px;margin-top:6px;}
#msgBox{white-space:pre-wrap;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;min-height:100px;}
.hide{display:none!important;}
.addRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.addRow input{border:1px solid var(--line);border-radius:6px;padding:7px;font-size:13px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;}
@media(max-width:700px){table{font-size:11px}td img{width:44px;height:44px}}
</style>
</head>
<body>
<header>
<img id="hdrLogo" src="" alt="Procut">
<h1>Procut <span>Quotation Generator</span></h1>
</header>
<div class="wrap">

<div class="card">
<h2><span class="n">1</span> Paste Enquiry / Catalog URL</h2>
<textarea id="enquiryInput" placeholder="Paste the customer's WhatsApp enquiry text, or the catalog link (with ?p=...&q=...)"></textarea>
<div class="row">
<button class="btn-y" onclick="parseEnquiry()">Extract Products</button>
<button class="btn-out" onclick="clearAll()">Start New Enquiry</button>
</div>
<div class="hint" id="parseHint"></div>
</div>

<div class="card">
<h2><span class="n">2</span> Select Price Type</h2>
<div class="price-opts" id="priceOpts">
<label class="sel"><input type="radio" name="ptype" value="w" checked> Wholesale Dealer</label>
<label><input type="radio" name="ptype" value="s"> Sub Dealer</label>
<label><input type="radio" name="ptype" value="r"> Retailer</label>
<label><input type="radio" name="ptype" value="e"> End User</label>
</div>
</div>

<div class="card hide" id="section3">
<h2><span class="n">3</span> Extracted Products</h2>
<div id="extractStatus"></div>
</div>

<div class="card hide" id="section4">
<h2><span class="n">4</span> Review &amp; Edit</h2>
<div style="overflow-x:auto">
<table id="reviewTable">
<thead><tr><th>#</th><th>Img</th><th>Product</th><th>Code</th><th>Variant</th><th>Qty</th><th>Price (as in sheet)</th><th>Status</th><th></th></tr></thead>
<tbody id="reviewBody"></tbody>
</table>
</div>
<div id="variantArea"></div>
<div class="addRow">
<input id="addCode" placeholder="Item Code">
<input id="addQty" placeholder="Qty" style="width:60px" value="1">
<button class="btn-out btn-sm" onclick="addManual()">+ Add Product</button>
</div>
<div class="row">
<button class="btn-dark" onclick="confirmGenerate()">✅ Confirm &amp; Generate</button>
</div>
</div>

<div class="card hide" id="section5">
<h2><span class="n">5</span> Generate Output</h2>
<div class="row">
<input id="custName" placeholder="Customer name (optional)" style="flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:6px;">
</div>
<div class="row">
<button class="btn-y" onclick="genMessage()">Generate WhatsApp Message</button>
<button class="btn-dark" onclick="genPDF()">Generate PDF</button>
</div>
<div id="msgBox" class="hide"></div>
<div class="row hide" id="msgBtns">
<button class="btn-out btn-sm" onclick="copyMsg()">Copy Message</button>
<button class="btn-out btn-sm" onclick="openWA()">Open WhatsApp</button>
</div>
</div>

</div>

document.getElementById('hdrLogo').src = 'data:image/png;base64,' + LOGO_B64;

let priceType = 'w';
let lines = []; // final review lines
let lineSeq = 1;

document.querySelectorAll('input[name=ptype]').forEach(r=>{
  r.addEventListener('change', e=>{
    document.querySelectorAll('#priceOpts label').forEach(l=>l.classList.remove('sel'));
    e.target.closest('label').classList.add('sel');
    priceType = e.target.value;
    lines.forEach(l=>{ if(!l.priceManual) l.price = l.prices[priceType] ?? l.price; });
    renderReview();
  });
});

function parseEnquiry(){
  const raw = document.getElementById('enquiryInput').value.trim();
  const hint = document.getElementById('parseHint');
  if(!raw){ hint.textContent='Paste an enquiry first.'; return; }
  let items = []; // {code, qty}
  const urlMatch = raw.match(/https?:\/\/\S+/);
  if(urlMatch && /[?&]p=/.test(urlMatch[0])){
    try{
      const u = new URL(urlMatch[0]);
      const p = (u.searchParams.get('p')||'').split(',').map(s=>s.trim()).filter(Boolean);
      const q = (u.searchParams.get('q')||'').split(',').map(s=>s.trim());
      p.forEach((code,i)=> items.push({code: code.toUpperCase(), qty: parseInt(q[i])||1}));
      hint.textContent = 'Parsed from catalog URL: ' + p.length + ' item(s).';
    }catch(e){ hint.textContent='Could not parse URL, falling back to text parsing.'; }
  }
  if(items.length===0){
    const lines_ = raw.split(/\n/);
    let curCode=null, curQty=1;
    const codeRe = /item\s*code[\s:\-]*([A-Za-z0-9\-]+)/i;
    const qtyRe = /qty[\s:\-]*([0-9]+)/i;
    lines_.forEach(l=>{
      const cm = l.match(codeRe);
      const qm = l.match(qtyRe);
      if(cm){ items.push({code: cm[1].toUpperCase(), qty: curQty}); curCode=null; }
      if(qm && items.length){ items[items.length-1].qty = parseInt(qm[1])||1; }
    });
    if(items.length===0){ hint.textContent='No "Item Code" entries found. Please check the enquiry text.'; return; }
    hint.textContent = 'Parsed from text: ' + items.length + ' item(s).';
  }
  // dedupe same code -> sum qty
  const merged = {};
  items.forEach(it=>{ if(!it.code) return; merged[it.code] = (merged[it.code]||0) + (it.qty||1); });
  fetchAndBuild(Object.keys(merged), merged);
}

async function fetchAndBuild(codes, qtyMap){
  document.getElementById('section3').classList.remove('hide');
  const statusEl = document.getElementById('extractStatus');
  statusEl.innerHTML = 'Looking up ' + codes.length + ' item(s) from catalog…';
  let data;
  try{
    const url = APPS_SCRIPT_URL + '?action=getQuoteData' + (SHEET_NAMES?('&sheets='+encodeURIComponent(SHEET_NAMES)):'') + '&codes=' + encodeURIComponent(codes.join(','));
    const res = await fetch(url);
    data = await res.json();
    if(data.error) throw new Error(data.error);
  }catch(e){
    statusEl.innerHTML = '<span class="badge b-bad">Fetch failed: '+e.message+'. Check APPS_SCRIPT_URL in the code.</span>';
    return;
  }
  lines = [];
  const found = {};
  (data.products||[]).forEach(p=> found[p.code]=p);
  let okCount=0, missCount=0, multiCount=0;
  codes.forEach(code=>{
    const p = found[code];
    const qty = qtyMap[code] || 1;
    if(!p || !p.variants || p.variants.length===0){ missCount++; lines.push(mkLine({code, qty, missing:true})); return; }
    if(p.variants.length===1){
      okCount++;
      lines.push(mkLine({code, qty, name:p.variants[0].name, img:p.variants[0].img, prices:p.variants[0].prices, hsn:p.variants[0].hsn, gst:p.variants[0].gst, category:p.variants[0].sheet}));
    } else {
      multiCount++;
      p.variants.forEach(v=>{
        lines.push(mkLine({code, qty, name:v.name, img:v.img, prices:v.prices, hsn:v.hsn, gst:v.gst, variant:true, variantSelected:true, category:v.sheet}));
      });
    }
  });
  statusEl.innerHTML = '<span class="badge b-ok">'+okCount+' matched</span> &nbsp;'+
    (multiCount?'<span class="badge b-warn">'+multiCount+' multi-variant</span> &nbsp;':'')+
    (missCount?'<span class="badge b-bad">'+missCount+' not found</span>':'');
  document.getElementById('section4').classList.remove('hide');
  renderReview();
}

function mkLine(o){
  return {
    id: lineSeq++,
    code: o.code, name: o.name||'', img: o.img||'', qty: o.qty||1,
    prices: o.prices||{}, price: (o.prices? (o.prices[priceType]||'') : ''),
    hsn: o.hsn||'', category: o.category||'', missing: !!o.missing,
    variant: !!o.variant, variantSelected: o.variantSelected!==false,
    priceManual:false, removed:false
  };
}

function renderReview(){
  const body = document.getElementById('reviewBody');
  body.innerHTML='';
  let n=1;
  lines.filter(l=>!l.removed).forEach(l=>{
    if(l.variant && !l.variantSelected) return;
    const tr = document.createElement('tr');
    let statusBadge = l.missing? '<span class="badge b-bad">❌ Not Found</span>' :
      (!l.price? '<span class="badge b-warn">No price</span>' : '<span class="badge b-ok">Matched</span>');
    tr.innerHTML = `
      <td>${n++}</td>
      <td>${l.img?`<img src="${l.img}" onerror="this.style.display='none'">`:''}</td>
      <td><input class="cell" value="${escAttr(l.name)}" onchange="updField(${l.id},'name',this.value)" ${l.missing?'placeholder="Enter description"':''}></td>
      <td><input class="cell" style="width:80px" value="${escAttr(l.code)}" onchange="updField(${l.id},'code',this.value)"></td>
      <td>${l.variant?'variant':''}</td>
      <td><input class="cell qty" type="number" min="1" value="${l.qty}" onchange="updField(${l.id},'qty',this.value)"></td>
      <td><input class="cell price" style="width:130px" value="${escAttr(l.price)}" onchange="updField(${l.id},'price',this.value)"></td>
      <td>${statusBadge}</td>
      <td><button class="btn-danger btn-sm" onclick="removeLine(${l.id})">✕</button></td>`;
    body.appendChild(tr);
  });
  renderVariantChoosers();
}

function renderVariantChoosers(){
  const area = document.getElementById('variantArea');
  const byCode = {};
  lines.filter(l=>l.variant && !l.removed).forEach(l=>{ (byCode[l.code]=byCode[l.code]||[]).push(l); });
  area.innerHTML='';
  Object.keys(byCode).forEach(code=>{
    const group = byCode[code];
    const div = document.createElement('div');
    div.className='variant-group';
    div.innerHTML = `<div class="vhead">Multiple variants found — ${code} (select the ones to include)</div>` +
      group.map(v=>`<div class="vrow"><input type="checkbox" ${v.variantSelected?'checked':''} onchange="toggleVariant(${v.id},this.checked)">
        <span style="flex:1">${escAttr(v.name)}</span><b>${escAttr(v.price)||'-'}</b></div>`).join('');
    area.appendChild(div);
  });
}

function toggleVariant(id, checked){
  const l = lines.find(x=>x.id===id); l.variantSelected = checked; renderReview();
}
function updField(id, field, val){
  const l = lines.find(x=>x.id===id);
  if(field==='qty') l.qty = Math.max(1, parseInt(val)||1);
  else if(field==='price'){ l.price = val; l.priceManual=true; }
  else l[field]=val;
  renderReview();
}
function removeLine(id){ const l=lines.find(x=>x.id===id); l.removed=true; renderReview(); }
async function addManual(){
  const code = document.getElementById('addCode').value.trim().toUpperCase();
  const qty = parseInt(document.getElementById('addQty').value)||1;
  if(!code) return;
  try{
    const url = APPS_SCRIPT_URL + '?action=getQuoteData' + (SHEET_NAMES?('&sheets='+encodeURIComponent(SHEET_NAMES)):'') + '&codes=' + encodeURIComponent(code);
    const res = await fetch(url); const data = await res.json();
    const p = (data.products||[]).find(x=>x.code===code);
    if(!p || !p.variants.length){ lines.push(mkLine({code, qty, missing:true})); }
    else if(p.variants.length===1){ lines.push(mkLine({code, qty, name:p.variants[0].name, img:p.variants[0].img, prices:p.variants[0].prices, hsn:p.variants[0].hsn, gst:p.variants[0].gst})); }
    else { p.variants.forEach(v=> lines.push(mkLine({code, qty, name:v.name, img:v.img, prices:v.prices, hsn:v.hsn, gst:v.gst, variant:true, variantSelected:true}))); }
  }catch(e){ lines.push(mkLine({code, qty, missing:true})); }
  document.getElementById('addCode').value='';
  renderReview();
};

function activeLines(){ return lines.filter(l=>!l.removed && !l.missing && (!l.variant || l.variantSelected) && l.price); }

function confirmGenerate(){
  if(activeLines().length===0){ toast('No valid priced products to generate. Please fix the review table.'); return; }
  document.getElementById('section5').classList.remove('hide');
  document.getElementById('section5').scrollIntoView({behavior:'smooth'});
}

function toAscii(str){
  return (str||'').toString()
    .normalize('NFKD')            // decomposes styled unicode (bold/italic/script letters) to plain Latin
    .replace(/[\u0300-\u036f]/g,'') // strip accents
    .replace(/[^\x00-\x7F]/g,'')  // drop remaining non-ascii (emoji, corrupted bytes, etc.)
    .replace(/\s+/g,' ').trim();
}

function genMessage(){
  const al = activeLines();
  let msg = 'Hello,\n\nPlease find the prices for your enquiry:\n\n';
  al.forEach((l,i)=>{
    msg += `${i+1}. ${toAscii(l.name)}\n   Item Code: ${l.code}\n   Qty: ${l.qty}\n   Price: ${toAscii(l.price)}\n\n`;
  });
  msg += `Thank you.`;
  const box = document.getElementById('msgBox');
  box.textContent = msg; box.classList.remove('hide');
  document.getElementById('msgBtns').classList.remove('hide');
}
function copyMsg(){ navigator.clipboard.writeText(document.getElementById('msgBox').textContent); toast('Message copied'); }
function openWA(){ window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('msgBox').textContent),'_blank'); }

function genPDF(){
  const al = activeLines();
  if(al.length===0){ toast('Nothing to generate.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.addImage('data:image/png;base64,'+LOGO_B64, 'PNG', 14, 10, 30, 18.6);
  doc.setFontSize(18); doc.setTextColor(20,20,20); doc.setFont(undefined,'bold');
  doc.text('PRICE QUOTATION', 196, 18, {align:'right'});
  doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.setTextColor(100);
  const date = new Date().toLocaleDateString('en-IN');
  doc.text('Date: '+date, 196, 25, {align:'right'});
  const custName = document.getElementById('custName').value.trim();
  if(custName) doc.text('Customer: '+toAscii(custName), 196, 30, {align:'right'});
  doc.setDrawColor(246,185,10); doc.setLineWidth(1); doc.line(14,32,196,32);

  const body = al.map((l,i)=>[i+1, toAscii(l.name), l.code, l.qty, toAscii(l.price)]);
  doc.autoTable({
    startY: 42,
    head: [['No.','Product','Item Code','Qty','Price']],
    body,
    theme:'grid',
    headStyles:{fillColor:[20,20,20],textColor:[255,255,255],fontSize:10,cellPadding:4},
    bodyStyles:{fontSize:9.5,cellPadding:4,minCellHeight:10,valign:'middle'},
    alternateRowStyles:{fillColor:[251,249,238]},
    styles:{lineColor:[229,229,224],lineWidth:0.2},
    columnStyles:{0:{cellWidth:12,halign:'center'},1:{cellWidth:88},2:{cellWidth:28},3:{cellWidth:16,halign:'center'},4:{cellWidth:38}},
    margin:{left:14,right:14}
  });
  let y = doc.lastAutoTable.finalY + 14;

  const pageH = doc.internal.pageSize.height;
  doc.setDrawColor(230); doc.line(14, pageH-22, 196, pageH-22);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(120);
  doc.text(COMPANY.name + ' — ' + COMPANY.tagline, 14, pageH-16);
  let footer2 = [];
  if(COMPANY.phone) footer2.push('Contact: '+COMPANY.phone);
  if(COMPANY.gstin) footer2.push('GSTIN: '+COMPANY.gstin);
  if(footer2.length) doc.text(footer2.join('   |   '), 14, pageH-11);
  doc.text('Thank you for your business!', 14, pageH-6);

  doc.save('Procut_Quotation_'+date.replace(/\//g,'-')+'.pdf');
}

function clearAll(){
  document.getElementById('enquiryInput').value='';
  lines=[];
  document.getElementById('section3').classList.add('hide');
  document.getElementById('section4').classList.add('hide');
  document.getElementById('section5').classList.add('hide');
  document.getElementById('msgBox').classList.add('hide');
  document.getElementById('msgBtns').classList.add('hide');
}
function escAttr(s){ return (s||'').toString().replace(/"/g,'&quot;'); }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
</script>
